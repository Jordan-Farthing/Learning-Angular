<div class="top-menu">

    <img class="logo"
         src="https://angular-academy.s3.amazonaws.com/main-logo/main-page-logo-small-hat.png">

</div>

<div class="demo">
    <div>Start Date: {{startDate | date: 'MMM/dd/yyyy'}}</div>
    <div>{{title | uppercase}}</div>
    <div>{{price | number: '3.3-5'}}</div>
    <div>{{price | currency: 'EUR'}}</div>
    <div>Percentage: {{rate | percent}}</div>
</div>

{{courses | json}}



<div>
    <div class="courses">

        <course-card (courseSelected)="onCourseSelected($event)" [course]="courses[0]">
        </course-card>

        <course-card (courseSelected)="onCourseSelected($event)" [course]="courses[1]">
        </course-card>
    
    </div>
</div>

<div *ngFor="let pair of course | keyvalue">
    {{pair.key + ': ' + pair.value}}
</div>
